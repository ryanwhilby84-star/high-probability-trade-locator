name: Refresh and publish Institutional Edge data
on:
  workflow_dispatch:

concurrency:
  group: institutional-edge-data-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      PYTHONPATH: src
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web-dashboard/package-lock.json
      - name: Verify deployment credentials
        run: |
          test -n "$VERCEL_TOKEN" || { echo "VERCEL_TOKEN secret missing"; exit 1; }
          test -n "$VERCEL_ORG_ID" || { echo "VERCEL_ORG_ID secret missing"; exit 1; }
          test -n "$VERCEL_PROJECT_ID" || { echo "VERCEL_PROJECT_ID secret missing"; exit 1; }
      - name: Verify price-provider credentials before data processing
        env:
          OANDA_API_KEY: ${{ secrets.OANDA_API_KEY }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
        run: |
          test -n "$OANDA_API_KEY" || { echo "::error title=Missing OANDA credential::Configure OANDA_API_KEY as a repository Actions secret"; exit 1; }
          test -n "$ALPHA_VANTAGE_API_KEY" || { echo "::error title=Missing Alpha Vantage credential::Configure ALPHA_VANTAGE_API_KEY as a repository Actions secret"; exit 1; }
          echo "Required provider credentials are configured (values not printed)."
      - name: Install COT pipeline dependencies
        run: python -m pip install -r requirements.txt
      - name: Refresh real price history and publish dashboard price snapshot
        env:
          OANDA_API_KEY: ${{ secrets.OANDA_API_KEY }}
          OANDA_ACCOUNT_ID: ${{ secrets.OANDA_ACCOUNT_ID }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
        run: |
          python scripts/run_price_refresh.py --require-healthy
          test -s web-dashboard/public/data/prices_latest.json || { echo "::error::Price exporter did not create prices_latest.json"; exit 1; }
      - name: Fetch and rebuild COT confluence data
        env:
          HPTL_STAGE_TIMEOUT_S: '900'
          PYTHONUNBUFFERED: '1'
        run: python -m hptl.cot.run_update --force
      - name: Validate rolling percentile regression tests
        run: python -m pytest tests/test_weekly_inspector_flow.py -q
      - name: Refresh commercial attention
        run: python scripts/run_commercial_attention_engine.py
      - name: Validate release snapshot and freshness
        run: python scripts/package_dashboard_data_release.py --data-dir web-dashboard/public/data --output /tmp/institutional-edge-data-release.zip --max-cot-age-days 14
      - name: Install frontend dependencies
        run: npm ci --prefix web-dashboard
      - name: Verify frontend and required data
        env:
          REQUIRE_DASHBOARD_DATA: '1'
        run: npm run build --prefix web-dashboard
      - name: Verify Attention Board parity with Weekly Inspector
        run: node web-dashboard/scripts/verifyAttentionSnapshot.mjs
      - name: Deploy validated build to Vercel production
        working-directory: web-dashboard
        run: |
          npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx --yes vercel@latest build --prod --token="$VERCEL_TOKEN"
          npx --yes vercel@latest deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN"
      - name: Upload generated data and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: institutional-edge-release-diagnostics
          path: |
            web-dashboard/public/data/confluence_history_latest.json
            web-dashboard/public/data/cot_commercial_attention_latest.json
            web-dashboard/public/data/cot_weekly_inspector_latest.json
            web-dashboard/public/data/prices_latest.json
            /tmp/institutional-edge-data-release.zip
          if-no-files-found: warn
          retention-days: 7
      - name: Verify production data endpoint
        env:
          PRODUCTION_URL: https://high-probability-trade-locator-seven.vercel.app
        run: |
          python - <<'PY'
          import json, os, time, urllib.request
          url = os.environ["PRODUCTION_URL"].rstrip("/") + "/data/confluence_history_latest.json"
          for attempt in range(12):
              try:
                  with urllib.request.urlopen(url + "?verify=" + str(int(time.time())), timeout=20) as response:
                      doc = json.load(response)
                  if not doc.get("records") or not doc.get("latest_cot_report_date"):
                      raise ValueError("Missing confluence records or report date")
                  print("Production confluence verified:", doc["latest_cot_report_date"], "rows:", len(doc["records"]))
                  break
              except Exception as exc:
                  if attempt == 11:
                      raise
                  print("Waiting for production deployment:", exc)
                  time.sleep(10)
          PY
