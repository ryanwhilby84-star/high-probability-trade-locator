name: Refresh and publish Institutional Edge data
on:
  workflow_dispatch:
  schedule:
    # Saturday after the CFTC Friday release; keep production refreshed without a local PC.
    - cron: '0 8 * * 6'
  push:
    branches: [main]
    paths:
      - '.github/workflows/production-data-release.yml'
      - 'web-dashboard/src/workstation/WeeklyInspector.jsx'
      - 'web-dashboard/src/workstation/CotWorkstation.jsx'
      - 'src/hptl/cot/positioning_research_engine.py'

concurrency:
  group: institutional-edge-data-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      PYTHONPATH: src
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web-dashboard/package-lock.json
      - name: Verify deployment credentials
        run: |
          test -n "$VERCEL_TOKEN" || { echo "VERCEL_TOKEN secret missing"; exit 1; }
          test -n "$VERCEL_ORG_ID" || { echo "VERCEL_ORG_ID secret missing"; exit 1; }
          test -n "$VERCEL_PROJECT_ID" || { echo "VERCEL_PROJECT_ID secret missing"; exit 1; }
      - name: Verify Vercel project access before expensive data processing
        run: |
          python - <<'PY'
          import json, os, urllib.error, urllib.parse, urllib.request
          project = urllib.parse.quote(os.environ["VERCEL_PROJECT_ID"], safe="")
          team = urllib.parse.quote(os.environ["VERCEL_ORG_ID"], safe="")
          url = f"https://api.vercel.com/v9/projects/{project}?teamId={team}"
          req = urllib.request.Request(url, headers={"Authorization": "Bearer " + os.environ["VERCEL_TOKEN"]})
          try:
              with urllib.request.urlopen(req, timeout=25) as resp:
                  payload = json.load(resp)
              print("Vercel project access verified:", payload.get("name", "project"), payload.get("id", ""))
          except urllib.error.HTTPError as exc:
              print(f"::error::Vercel project API returned HTTP {exc.code}; check token scope and project/team IDs")
              raise SystemExit(1)
          PY
      - name: Verify price-provider credentials before data processing
        env:
          OANDA_API_KEY: ${{ secrets.OANDA_API_KEY }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
        run: |
          test -n "$OANDA_API_KEY" || { echo "::error title=Missing OANDA credential::Configure OANDA_API_KEY as a repository Actions secret"; exit 1; }
          test -n "$ALPHA_VANTAGE_API_KEY" || { echo "::error title=Missing Alpha Vantage credential::Configure ALPHA_VANTAGE_API_KEY as a repository Actions secret"; exit 1; }
          echo "Required provider credentials are configured (values not printed)."
      - name: Install COT pipeline dependencies
        run: python -m pip install -r requirements.txt
      - name: Refresh real price history and publish dashboard price snapshot
        env:
          OANDA_API_KEY: ${{ secrets.OANDA_API_KEY }}
          OANDA_ACCOUNT_ID: ${{ secrets.OANDA_ACCOUNT_ID }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
        run: |
          python scripts/run_price_refresh.py --require-healthy
          test -s web-dashboard/public/data/prices_latest.json || { echo "::error::Price exporter did not create prices_latest.json"; exit 1; }
      - name: Fetch and rebuild COT confluence data
        env:
          HPTL_STAGE_TIMEOUT_S: '900'
          PYTHONUNBUFFERED: '1'
        run: python -m hptl.cot.run_update --force --ensure-from-year 2011
      - name: Validate rolling percentile regression tests
        run: |
          python -m pip install pytest
          python -m pytest tests/test_weekly_inspector_flow.py -q
      - name: Regenerate Weekly Inspector from refreshed COT history
        run: python -m hptl.cot.weekly_inspector_export
      - name: Refresh commercial attention
        run: python scripts/run_commercial_attention_engine.py
      - name: Validate release snapshot and freshness
        run: |
          python - <<'PY'
          import json
          from datetime import date, datetime
          from pathlib import Path
          root = Path("web-dashboard/public/data")
          inspector = json.loads((root / "cot_weekly_inspector_latest.json").read_text())
          if inspector.get("measure") != "net_positioning_rolling_156_week_percentile":
              raise SystemExit("FAIL: Weekly Inspector uses incompatible percentile measure")
          markets = inspector.get("markets") or {}
          dates = [m["rows"][-1][0] for m in markets.values() if m.get("available") and m.get("rows")]
          if not dates:
              raise SystemExit("FAIL: Weekly Inspector contains no available dated markets")
          latest = date.fromisoformat(max(dates))
          age = (datetime.now().date() - latest).days
          print(f"Weekly Inspector latest COT week: {latest}; age: {age} days; markets: {len(dates)}")
          if age < 0 or age > 14:
              raise SystemExit(f"FAIL: COT data freshness gate: {age} days")
          PY
      - name: Audit all COT graph nets and 156-week percentiles against one history source
        run: python scripts/audit_cot_chart_percentile_parity.py
      - name: Install frontend dependencies
        run: npm ci --prefix web-dashboard
      - name: Verify frontend and required data
        env:
          REQUIRE_DASHBOARD_DATA: '1'
        run: npm run build --prefix web-dashboard
      - name: Verify Attention Board parity with Weekly Inspector
        run: node web-dashboard/scripts/verifyAttentionSnapshot.mjs
      - name: Publish validated COT exports to main for Vercel Git builds
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web-dashboard/public/data/cot_3y_series_latest.json web-dashboard/public/data/cot_weekly_inspector_latest.json web-dashboard/public/data/cot_attention_80_20_latest.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish fresh validated COT percentile snapshots [skip ci]"
            # Generated price and diagnostic files may remain modified after the build.
            # Keep only the audited data commit during the rebase; never publish unrelated files.
            git reset --hard HEAD
            git clean -fd -- web-dashboard/.vercel/output
            # The validation job is long-running; UI commits may arrive meanwhile.
            # Rebase the generated data-only commit onto current main before pushing.
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "::error::Unable to publish validated COT exports after 3 retries"
                exit 1
              fi
            done
          else
            echo "Validated COT exports unchanged."
          fi
      - name: Deploy validated build to Vercel production
        working-directory: web-dashboard
        run: |
          # The Vercel remote build requires a shell unavailable in the prior CLI build path.
          # Deploy the already validated Vite dist as a static prebuilt output instead.
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path(".vercel/output")
          root.mkdir(parents=True, exist_ok=True)
          (root / "config.json").write_text(json.dumps({"version": 3, "routes": [{"handle": "filesystem"}]}))
          PY
          mkdir -p .vercel/output/static
          cp -a dist/. .vercel/output/static/
          # The CLI resolves a user profile even for valid team-scoped API tokens.
          # Deploy the validated static output directly through the Vercel REST API.
          python - <<'PY'
          import hashlib, json, os, pathlib, urllib.error, urllib.parse, urllib.request
          root = pathlib.Path(".vercel/output")
          token = os.environ["VERCEL_TOKEN"]
          team = urllib.parse.quote(os.environ["VERCEL_ORG_ID"])
          headers = {"Authorization": "Bearer " + token}
          files = []
          for path in sorted(root.rglob("*")):
              if not path.is_file():
                  continue
              file_size = path.stat().st_size
              print(f"Deployment asset: {path.relative_to(root)} ({file_size / 1048576:.1f} MiB)", flush=True)
              if file_size > 95 * 1024 * 1024:
                  raise SystemExit(
                      f"Deployment asset exceeds Vercel's 100 MB file limit: "
                      f"{path.relative_to(root)} ({file_size / 1048576:.1f} MiB). "
                      "Move this dataset to external storage or split it without losing history."
                  )
              data = path.read_bytes()
              sha = hashlib.sha1(data).hexdigest()
              upload_url = f"https://api.vercel.com/v2/files?teamId={team}"
              req = urllib.request.Request(upload_url, data=data, headers={
                  **headers,
                  "Content-Type": "application/octet-stream",
                  "Content-Length": str(len(data)),
                  "x-vercel-digest": sha,
              }, method="POST")
              try:
                  with urllib.request.urlopen(req, timeout=180):
                      pass
              except urllib.error.HTTPError as exc:
                  # An existing upload with the same digest may be reusable.
                  if exc.code != 409:
                      print("::error::Vercel file upload HTTP", exc.code, exc.read(1200).decode("utf-8", "replace"))
                      raise SystemExit(1)
              files.append({"file": str(path.relative_to(root)).replace("\\\\", "/"), "sha": sha, "size": len(data)})
          print(f"Uploaded {len(files)} validated prebuilt files")
          payload = json.dumps({
              "name": "high-probability-trade-locator",
              "project": os.environ["VERCEL_PROJECT_ID"],
              "target": "production",
              "files": files,
              "version": 2,
              "projectSettings": {"framework": None}
          }).encode()
          url = f"https://api.vercel.com/v13/deployments?teamId={team}"
          req = urllib.request.Request(url, data=payload, headers={
              **headers, "Content-Type": "application/json"
          }, method="POST")
          try:
              with urllib.request.urlopen(req, timeout=180) as resp:
                  result = json.load(resp)
          except urllib.error.HTTPError as exc:
              print("::error::Vercel deployment API HTTP", exc.code, exc.read(1200).decode("utf-8", "replace"))
              raise SystemExit(1)
          deployment_id = result.get("id")
          if not deployment_id:
              raise SystemExit("Vercel API did not return a deployment ID")
          print("Vercel deployment created:", deployment_id, result.get("url", ""))
          import time
          for attempt in range(60):
              time.sleep(10)
              status_url = "https://api.vercel.com/v13/deployments/" + deployment_id + "?teamId=" + urllib.parse.quote(os.environ["VERCEL_ORG_ID"])
              with urllib.request.urlopen(urllib.request.Request(status_url, headers={"Authorization": "Bearer " + os.environ["VERCEL_TOKEN"]}), timeout=30) as resp:
                  state = json.load(resp)
              ready = state.get("readyState")
              if ready == "READY":
                  print("Vercel production deployment READY")
                  break
              if ready in ("ERROR", "CANCELED"):
                  raise SystemExit("Vercel deployment failed: " + str(ready))
          else:
              raise SystemExit("Vercel deployment did not become READY within 10 minutes")
          PY
      - name: Upload generated data and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: institutional-edge-release-diagnostics
          path: |
            web-dashboard/public/data/confluence_history_latest.json
            web-dashboard/public/data/cot_commercial_attention_latest.json
            web-dashboard/public/data/cot_weekly_inspector_latest.json
            web-dashboard/public/data/prices_latest.json
            /tmp/institutional-edge-data-release.zip
          if-no-files-found: warn
          retention-days: 7
      - name: Verify production data endpoint
        env:
          PRODUCTION_URL: https://high-probability-trade-locator-seven.vercel.app
        run: |
          python - <<'PY'
          import json, os, time, urllib.request
          url = os.environ["PRODUCTION_URL"].rstrip("/") + "/data/confluence_history_latest.json"
          for attempt in range(12):
              try:
                  with urllib.request.urlopen(url + "?verify=" + str(int(time.time())), timeout=20) as response:
                      doc = json.load(response)
                  if not doc.get("records") or not doc.get("latest_cot_report_date"):
                      raise ValueError("Missing confluence records or report date")
                  print("Production confluence verified:", doc["latest_cot_report_date"], "rows:", len(doc["records"]))
                  break
              except Exception as exc:
                  if attempt == 11:
                      raise
                  print("Waiting for production deployment:", exc)
                  time.sleep(10)
          PY
