name: Refresh and publish Institutional Edge data
on:
  workflow_dispatch:

concurrency:
  group: institutional-edge-data-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      PYTHONPATH: src
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p0-separate-vite-build-from-data-refresh
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web-dashboard/package-lock.json
      - name: Verify deployment credentials
        run: |
          test -n "$VERCEL_TOKEN" || { echo "VERCEL_TOKEN secret missing"; exit 1; }
          test -n "$VERCEL_ORG_ID" || { echo "VERCEL_ORG_ID secret missing"; exit 1; }
          test -n "$VERCEL_PROJECT_ID" || { echo "VERCEL_PROJECT_ID secret missing"; exit 1; }
      - name: Install COT pipeline dependencies
        run: python -m pip install -r requirements.txt
      - name: Fetch and rebuild COT confluence data
        run: python -m hptl.cot.run_update --force
      - name: Refresh commercial attention
        run: python scripts/run_commercial_attention_engine.py
      - name: Validate release snapshot and freshness
        run: python scripts/package_dashboard_data_release.py --data-dir web-dashboard/public/data --output /tmp/institutional-edge-data-release.zip --max-cot-age-days 14
      - name: Install frontend dependencies
        run: npm ci --prefix web-dashboard
      - name: Verify frontend and required data
        env:
          REQUIRE_DASHBOARD_DATA: '1'
        run: npm run build --prefix web-dashboard
      - name: Deploy validated build to Vercel production
        working-directory: web-dashboard
        run: |
          npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx --yes vercel@latest build --prod --token="$VERCEL_TOKEN"
          npx --yes vercel@latest deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN"
      - name: Verify production data endpoint
        env:
          PRODUCTION_URL: https://high-probability-trade-locator-seven.vercel.app
        run: |
          python - <<'PY'
          import json, os, time, urllib.request
          url = os.environ["PRODUCTION_URL"].rstrip("/") + "/data/confluence_history_latest.json"
          for attempt in range(12):
              try:
                  with urllib.request.urlopen(url + "?verify=" + str(int(time.time())), timeout=20) as response:
                      doc = json.load(response)
                  if not doc.get("records") or not doc.get("latest_cot_report_date"):
                      raise ValueError("Missing confluence records or report date")
                  print("Production confluence verified:", doc["latest_cot_report_date"], "rows:", len(doc["records"]))
                  break
              except Exception as exc:
                  if attempt == 11:
                      raise
                  print("Waiting for production deployment:", exc)
                  time.sleep(10)
          PY
