name: Seasonality Preview Validation
on:
  push:
    branches: ['fix/isolated-seasonality-contract-20261018']
  pull_request:
    paths:
      - 'web-dashboard/src/pages/SeasonalityWorkstationPage.jsx'
      - 'web-dashboard/src/seasonality/**'
      - 'web-dashboard/src/seasonality_workstation/**'
      - '.github/workflows/seasonality-preview-ci.yml'
  workflow_dispatch:
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web-dashboard/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install seasonality engine dependencies
        run: python -m pip install -r requirements.txt
      - name: Regenerate complete seasonal research without deploying
        env:
          PYTHONPATH: src
        run: |
          python scripts/run_seasonality_workstation_export.py
          python - <<'PY'
          import json
          from pathlib import Path
          doc = json.loads(Path("web-dashboard/public/data/seasonality_workstation_latest.json").read_text())
          markets = doc.get("markets", {})
          good = [m for m in markets.values() if m.get("status") == "ok"
                  and m.get("seasonal_roadmap", {}).get("available")
                  and m.get("weekly_roadmap")]
          print(f"Complete roadmap packs: {len(good)}/{len(markets)}")
          if not good:
              raise SystemExit("No complete seasonal roadmaps generated")
          PY
      - name: Verify seasonal windows and roadmap contracts
        working-directory: web-dashboard
        run: |
          node --test src/seasonality/sugarArchiveWindows.test.js src/seasonality_workstation/roadmapView.test.js src/seasonality_workstation/weeklyRoadmapContract.test.js
      - name: Build isolated seasonality preview
        working-directory: web-dashboard
        run: |
          npm ci
          npm run build
      - name: Check seasonal archive packaged
        run: |
          test -s web-dashboard/dist/data/seasonality_workstation_latest.json
          test -s web-dashboard/dist/data/sugar_archive_daily.json
