name: Workstation regression
on:
  push:
    branches:
      - fix/p0-separate-vite-build-from-data-refresh
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run test:workstation-data --prefix web-dashboard
