name: Publish verified COT data to preview
on:
  workflow_dispatch:
  push:
    branches: [fix/weekly-inspector-integrity-20261014]
    paths:
      - .github/workflows/publish-verified-cot-preview.yml

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-verified-cot-preview
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/weekly-inspector-integrity-20261014
          persist-credentials: true
      - name: Download green-run COT artifacts
        uses: actions/download-artifact@v4
        with:
          name: cot-live-diagnostic
          run-id: 38546014987
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: verified-artifact
      - name: Verify artifact and copy public exports
        run: |
          python - <<'PY'
          import json, shutil
          from pathlib import Path
          base = Path("verified-artifact/web-dashboard/public/data")
          target = Path("web-dashboard/public/data")
          a = json.loads((base/"cot_3y_series_latest.json").read_text())
          b = json.loads((base/"cot_weekly_inspector_latest.json").read_text())
          assert len(a["markets"]) == len(b["markets"]) == 26
          assert set(a["markets"]) == set(b["markets"])
          for name, block in a["markets"].items():
              series = block.get("series") or []
              rows = b["markets"][name].get("rows") or []
              assert len(rows) >= 156 and series, name
              assert series[-1]["date"] == rows[-1][0] == "2026-10-06", name
          target.mkdir(parents=True, exist_ok=True)
          for filename in ("cot_3y_series_latest.json", "cot_weekly_inspector_latest.json"):
              shutil.copy2(base/filename, target/filename)
              print(filename, (target/filename).stat().st_size)
          print("PASS: publishing 26 verified markets through 2026-10-06")
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install COT pipeline dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . -r requirements.txt
      - name: Regenerate missing dashboard feeds from fresh CFTC data
        shell: bash
        run: |
          set -o pipefail
          python -m hptl.cot.run_update --force 2>&1 | tee cot-publish-refresh.log
      - name: Verify complete dashboard publication
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          base=Path("web-dashboard/public/data")
          required=["cot_3y_series_latest.json","cot_weekly_inspector_latest.json","confluence_history_latest.json","cot_commercial_attention_latest.json"]
          for name in required:
              path=base/name
              assert path.is_file() and path.stat().st_size>100, f"Missing/empty dashboard feed: {name}"
              payload=json.loads(path.read_text())
              assert payload, f"Empty dashboard feed: {name}"
              print(name, path.stat().st_size)
          a=json.loads((base/required[0]).read_text())
          b=json.loads((base/required[1]).read_text())
          assert len(a["markets"])==len(b["markets"])==26
          for market,block in a["markets"].items():
              series=block.get("series") or []
              rows=b["markets"][market].get("rows") or []
              assert series and len(rows)>=156 and series[-1]["date"]==rows[-1][0]=="2026-10-06", market
          print("PASS: full dashboard feed set and 26 fresh aligned markets")
          PY
      - name: Commit verified data to preview branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f web-dashboard/public/data/cot_3y_series_latest.json web-dashboard/public/data/cot_weekly_inspector_latest.json web-dashboard/public/data/confluence_history_latest.json web-dashboard/public/data/cot_commercial_attention_latest.json
          if git diff --cached --quiet; then
            echo "Verified exports already committed"
          else
            git commit -m "Publish complete verified COT and confluence dashboard feeds through 2026-10-06"
            git push origin HEAD:fix/weekly-inspector-integrity-20261014
          fi
