name: P0 frontend build verification

on:
  pull_request:
    paths:
      - 'web-dashboard/**'
      - '.github/workflows/p0-frontend-build.yml'
      - 'scripts/validate_production_dashboard_data.py'
      - 'scripts/package_dashboard_data_release.py'
      - 'tests/test_dashboard_data_release.py'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web-dashboard/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Verify frontend build without Python
        run: npm run build
      - name: Verify generated frontend files
        run: |
          test -f dist/index.html
          test -d dist/assets

  production-data-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regression-test data packaging and failure isolation
        run: python -m unittest discover -s tests -p test_dashboard_data_release.py -v
      - name: Validate required dashboard data artifacts
        run: python scripts/validate_production_dashboard_data.py
