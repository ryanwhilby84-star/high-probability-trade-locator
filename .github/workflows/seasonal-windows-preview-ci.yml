name: Seasonal windows isolated validation
on:
  push:
    branches:
      - feature/sugar-windows-26-instruments-20261019
  workflow_dispatch:
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web-dashboard/package-lock.json
      - name: Install
        working-directory: web-dashboard
        run: npm ci
      - name: Run Sugar and daily window tests
        working-directory: web-dashboard
        run: node --test src/seasonality/sugarArchiveWindows.test.js src/seasonality/dailyClosesToSugarContract.test.js
      - name: Build complete existing dashboard
        working-directory: web-dashboard
        run: npm run build
