name: Weekly COT update
on:
  schedule:
    # After Friday CFTC publication; the release includes production verification.
    - cron: "0 6 * * 6"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hptl-weekly-cot
  cancel-in-progress: false
jobs:
  weekly-cot:
    uses: ./.github/workflows/production-data-release.yml
    secrets: inherit
