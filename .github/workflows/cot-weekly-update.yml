name: Weekly COT update

on:
  schedule:
    # Saturday 06:00 UTC — UK morning after US Friday CFTC release
    - cron: "0 6 * * 6"
    # Saturday 01:00 UTC — ~Friday 8:00 PM US Eastern (winter)
    - cron: "0 1 * * 6"
  workflow_dispatch:

concurrency:
  group: hptl-weekly-cot
  cancel-in-progress: false

jobs:
  weekly-cot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Unit tests (weekly COT)
        env:
          PYTHONPATH: src
        run: python -m unittest tests.test_weekly_cot_update tests.test_cot_parser -q

      - name: Weekly COT update
        id: cot_update
        env:
          PYTHONPATH: src
          HPTL_SKIP_LIVE_FEEDS: "1"
        run: python -m hptl.cot.run_weekly_update

      - name: Upload weekly run logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-cot-logs
          path: |
            data/exports/weekly_cot_update.log
            data/exports/weekly_cot_update_latest.json
            data/exports/weekly_cot_update_history.jsonl
          if-no-files-found: ignore

      # A successful CFTC refresh is not equivalent to a complete dashboard release.
      # Exporters can omit prices or confluence when their inputs are unavailable.
      - name: Refresh live instrument prices
        if: steps.cot_update.outcome == 'success'
        env:
          PYTHONPATH: src
          OANDA_API_KEY: ${{ secrets.OANDA_API_KEY }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          OANDA_ACCOUNT_ID: ${{ secrets.OANDA_ACCOUNT_ID }}
          OANDA_ENVIRONMENT: ${{ vars.OANDA_ENVIRONMENT || 'practice' }}
        run: python scripts/run_price_refresh.py --require-healthy

      - name: Rebuild price store and confluence exports
        if: steps.cot_update.outcome == 'success'
        env:
          PYTHONPATH: src
          HPTL_SKIP_LIVE_FEEDS: "1"
          OANDA_API_KEY: ${{ secrets.OANDA_API_KEY }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          OANDA_ACCOUNT_ID: ${{ secrets.OANDA_ACCOUNT_ID }}
          OANDA_ENVIRONMENT: ${{ vars.OANDA_ENVIRONMENT || 'practice' }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/run_dashboard_export_rebuild.py

      - name: Validate complete dashboard snapshot
        if: steps.cot_update.outcome == 'success'
        id: release_gate
        run: python scripts/validate_production_dashboard_data.py

      - name: Package verified dashboard snapshot
        if: steps.release_gate.outcome == 'success'
        run: python scripts/package_dashboard_data_release.py --output dashboard-data-release.zip

      - name: Upload verified dashboard snapshot for deployment
        if: steps.release_gate.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-data-release
          path: dashboard-data-release.zip
          if-no-files-found: error
          retention-days: 14

      # Deploy the exact validated files from this runner, not a fresh Git checkout
      # (which omits the gitignored generated price/confluence snapshots).
      - name: Publish verified dashboard to Vercel
        if: steps.release_gate.outcome == 'success'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_kOGOa74U24TdEdIhtyRsTtK6
          VERCEL_PROJECT_ID: prj_azYqGdff1iAUbl8MI0pMKaG2D3tK
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN secret is required to publish verified data. No deployment attempted."
            exit 1
          fi
          npm install --global vercel@latest
          cd web-dashboard
          vercel deploy --prod --yes --token "$VERCEL_TOKEN" --scope ryanwhilby84-stars-projects

      - name: Explain release status
        if: always()
        run: |
          echo "Weekly CFTC refresh outcome: ${{ steps.cot_update.outcome }}"
          echo "Complete production snapshot gate: ${{ steps.release_gate.outcome }}"
          echo "Only a complete validated snapshot is packaged; no production deployment is attempted here."
